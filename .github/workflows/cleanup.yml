name: Branch Cleanup

on:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday
  workflow_dispatch:      # Allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      
      - name: Clean up merged branches
        run: |
          # Delete merged feature branches
          git branch -r --merged origin/develop | grep 'origin/feature/' | sed 's/origin\///' | xargs -r git push origin --delete
      
      - name: List stale branches
        run: |
          # List branches not updated in 30 days
          git for-each-ref --sort=-committerdate --format='%(refname:short) %(committerdate:relative)' refs/remotes/origin | grep 'feature/'
        
      - name: Create issue for stale branches
        uses: actions/github-script@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const stale = process.env.STALE_BRANCHES;
            if (stale) {
              await github.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Stale branches detected',
                body: 'The following branches may need cleanup:\n\n' + stale
              });
            }